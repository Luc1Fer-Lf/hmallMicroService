server:
  port: 8080
spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
          server-addr: 47.93.37.97:8848
    gateway:
      routes:
          - id: item-service
            uri: lb://item-service
            predicates:
              - Path=/items/**,/search/**
          - id: user-service
            uri: lb://user-service
            predicates:
              - Path=/users/**
          - id: trade-service
            uri: lb://trade-service
            predicates:
              - Path=/orders/**
          - id: cart-service
            uri: lb://cart-service
            predicates:
              - Path=/carts/**
          - id: pay-service
            uri: lb://pay-service
            predicates:
              - Path=/pay-orders/**